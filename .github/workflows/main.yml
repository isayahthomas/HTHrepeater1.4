name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter CMakeLists.txt | Select-Object -First 1
          if (-not $f) { Get-ChildItem -Recurse -Depth 2 | Select-Object -ExpandProperty FullName; throw "No se encontro CMakeLists.txt en el repositorio" }
          cmake -S $f.DirectoryName -B build -A x64
      - name: Compilar
        run: cmake --build build --config Release --target RepeaterFX_VST3 --parallel
      - name: Subir el VST3
        uses: actions/upload-artifact@v4
        with:
          name: Repeater-VST3-Windows
          path: build/RepeaterFX_artefacts/Release/VST3/
